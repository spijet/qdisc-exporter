name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Run tests
        run: go test -covermode=atomic -coverprofile=coverage.txt ./...
      - name: Coveralls
        uses: coverallsapp/github-action@v2
        with:
          file: coverage.txt
          fail-on-error: false

  build:
    name: Build (linux/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: |
          VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "dev")
          SHORT_COMMIT="${GITHUB_SHA:0:7}"
          BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          go build -trimpath \
            -ldflags="-s -w -X main.version=${VERSION} -X main.commit=${SHORT_COMMIT} -X main.builtAt=${BUILD_DATE}" \
            -o qdisc-exporter-linux-${{ matrix.goarch }} \
            .
