name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:

  build:
    name: Build (linux/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test ./...

      - name: Build and package
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ github.ref_name }}
        run: |
          SHORT_COMMIT="${GITHUB_SHA:0:7}"
          BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          go build -trimpath \
            -ldflags="-s -w -X main.version=${VERSION} -X main.commit=${SHORT_COMMIT} -X main.builtAt=${BUILD_DATE}" \
            -o qdisc-exporter \
            .

          ARCHIVE="qdisc-exporter-${VERSION}-linux-${GOARCH}.tar.gz"
          tar czf "${ARCHIVE}" qdisc-exporter README.md grafana-dashboard.json
          sha256sum "${ARCHIVE}" > "${ARCHIVE}.sha256"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qdisc-exporter-linux-${{ matrix.goarch }}
          path: |
            qdisc-exporter-*.tar.gz
            qdisc-exporter-*.tar.gz.sha256
          retention-days: 1

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: dist/*
